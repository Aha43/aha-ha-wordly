<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Arne vs Harald — Wordle</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #1a1d24;
    --card2: #21252e;
    --line: #2b303b;
    --txt: #e7e9ee;
    --dim: #9aa1ad;
    --arne: #6aaa64;   /* wordle green */
    --harald: #c9b458; /* wordle yellow */
    --tie: #6b7280;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--txt);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.45;
    padding: 20px 16px 60px;
  }
  .wrap { max-width: 560px; margin: 0 auto; }
  .topbar { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 18px; }
  .topbar h1 { font-size: 1.15rem; margin: 0; letter-spacing: .3px; }
  .topbar a { color: var(--dim); text-decoration: none; font-size: .85rem; }
  .topbar a:hover { color: var(--txt); }
  .topright { display: flex; align-items: baseline; gap: 14px; }
  .flag { cursor: pointer; opacity: .3; font-size: 1.05rem; user-select: none; transition: opacity .15s; }
  .flag:hover { opacity: .6; }
  .flag.on { opacity: 1; }

  .season { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px; margin-bottom: 22px; }
  .season-title { font-size: .8rem; letter-spacing: 1.5px; text-transform: uppercase; color: var(--dim); margin: 0 0 12px; }

  .score { display: flex; align-items: flex-end; justify-content: center; gap: 14px; margin: 6px 0 4px; }
  .score .name { font-size: .72rem; letter-spacing: 1px; text-transform: uppercase; color: var(--dim); text-align: center; }
  .score .num { font-size: 2.8rem; font-weight: 800; line-height: 1; }
  .score .col { display: flex; flex-direction: column; align-items: center; gap: 4px;
                cursor: pointer; padding: 4px 10px; border-radius: 12px; transition: background .15s; }
  .score .col:hover { background: rgba(255,255,255,.05); }
  .score .col .name { text-decoration: underline dotted; text-underline-offset: 3px; }
  .score .col:hover .name { color: var(--txt); }
  .score .dash { font-size: 1.8rem; line-height: 1; color: var(--dim); font-weight: 300; padding: 0 2px; margin-bottom: .5rem; }
  .arne .num { color: var(--arne); }
  .harald .num { color: var(--harald); }

  .subline { text-align: center; color: var(--dim); font-size: .9rem; margin: 8px 0 4px; }
  .lead { text-align: center; font-size: .95rem; margin: 2px 0 12px; font-weight: 600; }

  .shout { background: var(--card2); border: 1px solid var(--line); border-radius: 12px;
           padding: 10px 14px; margin: 0 0 14px; font-size: .9rem; color: var(--txt); }
  .shout b { color: var(--arne); letter-spacing: .3px; }
  .shout .back { float: right; margin-left: 10px; color: var(--dim); cursor: pointer;
                 font-size: .78rem; font-style: normal; user-select: none; }
  .shout .back:hover { color: var(--txt); }
  .shout .nospeaker { color: var(--dim); font-style: italic; }

  .resume { background: var(--card2); border: 1px solid var(--line); border-left: 3px solid var(--tie);
            border-radius: 12px; padding: 10px 14px; margin: 0 0 14px; font-size: .9rem;
            color: var(--txt); font-style: italic; }
  .resume b { font-style: normal; letter-spacing: .3px; }
  .resume.r-arne { border-left-color: var(--arne); }
  .resume.r-arne b { color: var(--arne); }
  .resume.r-harald { border-left-color: var(--harald); }
  .resume.r-harald b { color: var(--harald); }

  .games { border-top: 1px solid var(--line); }
  .game { display: grid; grid-template-columns: 64px 1fr auto auto; align-items: center; gap: 10px;
          padding: 9px 2px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
  .game:last-child { border-bottom: none; }
  .games .game { cursor: pointer; }
  .games .game:hover { background: rgba(255,255,255,.035); }
  .game.sel { background: rgba(255,255,255,.055); }
  .game .mark { font-size: .6rem; opacity: .4; margin-left: 6px; }
  .game .date { color: var(--dim); font-size: .8rem; }
  .game .word { font-weight: 600; letter-spacing: 1px; }
  .game .att { font-size: .92rem; color: var(--dim); }
  .game .att b { color: var(--txt); }
  .badge { font-size: .68rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; letter-spacing: .5px; }
  .b-arne { background: rgba(106,170,100,.18); color: var(--arne); }
  .b-harald { background: rgba(201,180,88,.2); color: var(--harald); }
  .b-tie { background: rgba(107,114,128,.25); color: #b9bfca; }

  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.62); z-index: 50;
              display: flex; align-items: center; justify-content: center; padding: 18px; }
  .modal { background: var(--card); border: 1px solid var(--line); border-radius: 16px;
           width: 100%; max-width: 420px; max-height: 86vh; overflow-y: auto; padding: 18px; }
  .modal-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
  .modal-head h2 { margin: 0; font-size: 1.3rem; letter-spacing: .5px; }
  .modal-head .sub { font-size: .68rem; text-transform: uppercase; letter-spacing: 1.4px; color: var(--dim); }
  .modal-head .x { cursor: pointer; color: var(--dim); font-size: 1.15rem; line-height: 1; user-select: none; }
  .modal-head .x:hover { color: var(--txt); }
  .p-arne h2 { color: var(--arne); }
  .p-harald h2 { color: var(--harald); }

  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; margin-bottom: 10px; }
  .kpi { background: var(--card2); border: 1px solid var(--line); border-radius: 10px; padding: 8px 4px; text-align: center; }
  .kpi .v { font-size: 1.15rem; font-weight: 800; font-variant-numeric: tabular-nums; }
  .kpi .k { font-size: .58rem; text-transform: uppercase; letter-spacing: .7px; color: var(--dim); }
  .runline { text-align: center; color: var(--dim); font-size: .82rem; margin: 0 0 16px; }

  .msec { font-size: .68rem; text-transform: uppercase; letter-spacing: 1.4px; color: var(--dim); margin: 0 0 8px; }
  .dist { margin-bottom: 16px; }
  .drow { display: grid; grid-template-columns: 22px 1fr 26px; align-items: center; gap: 9px;
          margin-bottom: 5px; font-size: .8rem; font-variant-numeric: tabular-nums; }
  .drow .lab { color: var(--dim); text-align: right; }
  .drow .cnt { color: var(--dim); text-align: right; }
  .drow .bar { height: 10px; border-radius: 5px; background: rgba(255,255,255,.055); }
  .drow .bar i { display: block; height: 100%; border-radius: 5px; min-width: 2px; }
  .p-arne .drow .bar i { background: var(--arne); }
  .p-harald .drow .bar i { background: var(--harald); }
  .drow.fail .bar i { background: var(--tie); }
  .drow.fail .lab { color: var(--tie); }

  .srow { display: grid; grid-template-columns: 1fr auto auto; gap: 12px; align-items: center;
          padding: 7px 1px; border-top: 1px solid var(--line); font-size: .85rem;
          font-variant-numeric: tabular-nums; }
  .srow .rec { color: var(--dim); font-size: .8rem; }
  .srow .sav { color: var(--dim); font-size: .8rem; }

  .footer { text-align: center; color: var(--dim); font-size: .78rem; margin-top: 10px; }
  .loading, .err { text-align: center; color: var(--dim); padding: 40px 0; }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <h1>🟩 Arne vs Harald</h1>
    <span class="topright">
      <span id="langsw"><span class="flag" data-lang="no">🇳🇴</span> <span class="flag" data-lang="en">🇬🇧</span></span>
      <a id="playlink" href="https://gjett.net/" target="_blank" rel="noopener">Play ↗</a>
    </span>
  </div>
  <div id="root"><div class="loading">Loading…</div></div>
  <div class="footer" id="foot">Daily Wordle head-to-head · X = didn't solve (counts as 7)</div>
</div>
<div class="modal-bg" id="modal" style="display:none"></div>

<script>
const val = x => x === "X" ? 7 : x;
const esc = s => String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));

const I18N = {
  en: { play: "Play ↗", recap: "Season recap", latest: "latest ↩",
        nospeaker: "No speaker was yet hired!", tieBadge: "TIE",
        tie: n => n === 1 ? "1 tie" : n + " ties", spread: "spread", avg: "avg",
        leadWins: n => `${n} leads on wins`, leadSpread: n => `${n} leads on spread`,
        square: "All square",
        footer: "Daily Wordle head-to-head · X = didn't solve (counts as 7)",
        allTime: "All-time", played: "Played", won: "Won", tied: "Tied", lost: "Lost",
        avgLbl: "Avg", solvedLbl: "Solved", titles: "Titles", bestRun: "Best run",
        curRun: n => n ? `On a run of ${n} straight win${n > 1 ? "s" : ""}` : "No winning run going",
        distTitle: "Guess distribution", bySeason: "By season · W–T–L", failLbl: "X" },
  no: { play: "Spill ↗", recap: "Sesongoppsummering", latest: "siste ↩",
        nospeaker: "Ingen utroper var ansatt ennå!", tieBadge: "UAVGJORT",
        tie: n => `${n} uavgjort`, spread: "differanse", avg: "snitt",
        leadWins: n => `${n} leder på seire`, leadSpread: n => `${n} leder på differanse`,
        square: "Helt likt",
        footer: "Daglig Wordle-duell · X = ikke løst (teller som 7)",
        allTime: "Alle sesonger", played: "Spilt", won: "Seire", tied: "Uavgjort", lost: "Tap",
        avgLbl: "Snitt", solvedLbl: "Løst", titles: "Titler", bestRun: "Beste rekke",
        curRun: n => n ? `Inne i en rekke på ${n} strake seier${n > 1 ? "e" : ""}` : "Ingen seiersrekke på gang",
        distTitle: "Fordeling av forsøk", bySeason: "Per sesong · S–U–T", failLbl: "X" }
};
let LANG = localStorage.getItem("lang") || "en";
if (!I18N[LANG]) LANG = "en";
const T = () => I18N[LANG];
const tr = v => typeof v === "string" ? v : (v[LANG] || v.en);

function statsFor(games) {
  let aw = 0, hw = 0, ties = 0, aTot = 0, hTot = 0, spread = 0;
  for (const g of games) {
    const a = val(g.a), h = val(g.h);
    aTot += a; hTot += h;
    spread += h - a;             // positive => Arne ahead
    if (a < h) aw++; else if (h < a) hw++; else ties++;
  }
  const n = games.length || 1;
  return { aw, hw, ties, aTot, hTot, spread, aAvg: aTot / n, hAvg: hTot / n, n: games.length };
}

function leadLine(s) {
  if (s.aw > s.hw) return T().leadWins("Arne");
  if (s.hw > s.aw) return T().leadWins("Harald");
  if (s.spread > 0) return T().leadSpread("Arne");
  if (s.spread < 0) return T().leadSpread("Harald");
  return T().square;
}

function winnerBadge(g) {
  const a = val(g.a), h = val(g.h);
  if (a < h) return '<span class="badge b-arne">ARNE</span>';
  if (h < a) return '<span class="badge b-harald">HARALD</span>';
  return `<span class="badge b-tie">${T().tieBadge}</span>`;
}

const latestShoutIdx = games => {
  for (let i = games.length - 1; i >= 0; i--) if (games[i].shout) return i;
  return -1;
};

function shoutHTML(season, gi) {
  const g = season.games[gi];
  const isLatest = gi === latestShoutIdx(season.games);
  const back = isLatest ? "" : `<span class="back" data-back="1">${T().latest}</span>`;
  const txt = g.shout ? esc(tr(g.shout)) : `<span class="nospeaker">${T().nospeaker}</span>`;
  return `${back}<b>📣 ${esc(g.date)} · ${esc(g.word)}:</b> ${txt}`;
}

function seasonHTML(season, si) {
  const s = statsFor(season.games);
  const lead = leadLine(s);
  const tieTxt = T().tie(s.ties);
  const sp = (s.spread > 0 ? "+" : "") + s.spread;
  const shoutIdx = latestShoutIdx(season.games);
  const rows = season.games.map((g, gi) => `
    <div class="game${g.shout ? " has-shout" : ""}${gi === shoutIdx ? " sel" : ""}"
         data-si="${si}" data-gi="${gi}">
      <span class="date">${esc(g.date)}</span>
      <span class="word">${esc(g.word)}${g.shout ? '<span class="mark">📣</span>' : ""}</span>
      <span class="att"><b>${esc(g.a)}</b>–<b>${esc(g.h)}</b></span>
      ${winnerBadge(g)}
    </div>`).reverse().join("");
  const champ = s.aw > s.hw ? "r-arne" : s.hw > s.aw ? "r-harald"
              : s.spread > 0 ? "r-arne" : s.spread < 0 ? "r-harald" : "";
  const resume = season.resume
    ? `<div class="resume ${champ}"><b>🏁 ${T().recap}:</b> ${esc(tr(season.resume))}</div>` : "";
  return `
    <section class="season">
      ${resume}
      <p class="season-title">${esc(season.title)}</p>
      <div class="score">
        <div class="col arne" data-p="a"><span class="name">Arne</span><span class="num">${s.aw}</span></div>
        <span class="dash">–</span>
        <div class="col harald" data-p="h"><span class="name">Harald</span><span class="num">${s.hw}</span></div>
      </div>
      <div class="subline">${tieTxt} · ${T().spread} ${sp} · ${T().avg} ${s.aAvg.toFixed(1)} / ${s.hAvg.toFixed(1)}</div>
      <div class="lead">${esc(lead)}</div>
      ${shoutIdx >= 0 ? `<div class="shout" data-shoutbox="${si}">${shoutHTML(season, shoutIdx)}</div>` : ""}
      <div class="games">${rows}</div>
    </section>`;
}

function selectShout(si, gi) {
  const season = SEASONS[si];
  const box = document.querySelector(`[data-shoutbox="${si}"]`);
  if (!box || !season.games[gi]) return;
  box.innerHTML = shoutHTML(season, gi);
  document.querySelectorAll(`.game.sel[data-si="${si}"]`).forEach(el => el.classList.remove("sel"));
  const row = document.querySelector(`.game[data-si="${si}"][data-gi="${gi}"]`);
  if (row) row.classList.add("sel");
}

/* ---- player career stats (all seasons) ---- */

function champOf(season) {           // "a" | "h" | null — only for finished seasons
  if (!season.resume) return null;
  const s = statsFor(season.games);
  if (s.aw !== s.hw) return s.aw > s.hw ? "a" : "h";
  if (s.spread !== 0) return s.spread > 0 ? "a" : "h";
  return null;
}

function playerStats(p) {
  const o = p === "a" ? "h" : "a";
  let played = 0, w = 0, t = 0, l = 0, tot = 0, fails = 0, best = 0, run = 0, titles = 0;
  const dist = {}, seasons = [];
  for (const S of SEASONS) {
    const champ = champOf(S);
    if (champ === p) titles++;
    let sw = 0, st = 0, sl = 0, stot = 0;
    for (const g of S.games) {
      const me = val(g[p]), you = val(g[o]);
      played++; tot += me; stot += me;
      const k = g[p] === "X" ? "X" : g[p];
      dist[k] = (dist[k] || 0) + 1;
      if (k === "X") fails++;
      if (me < you) { w++; sw++; run++; if (run > best) best = run; }
      else if (me > you) { l++; sl++; run = 0; }
      else { t++; st++; run = 0; }
    }
    if (S.games.length)
      seasons.push({ title: S.title, w: sw, t: st, l: sl,
                     avg: stot / S.games.length, champ: champ === p });
  }
  const n = played || 1;
  return { played, w, t, l, avg: tot / n, solved: (played - fails) / n,
           titles, best, run, dist, seasons };
}

function playerModalHTML(p) {
  const st = playerStats(p);
  const name = p === "a" ? "Arne" : "Harald";
  const kpi = (v, k) => `<div class="kpi"><div class="v">${v}</div><div class="k">${k}</div></div>`;
  const keys = [];
  for (let i = 1; i <= 6; i++) if (i >= 2 || st.dist[i]) keys.push(i);
  keys.push("X");
  const max = Math.max(1, ...keys.map(k => st.dist[k] || 0));
  const bars = keys.map(k => {
    const c = st.dist[k] || 0;
    return `<div class="drow${k === "X" ? " fail" : ""}">
              <span class="lab">${k === "X" ? T().failLbl : k}</span>
              <span class="bar"><i style="width:${c ? Math.round(c / max * 100) : 0}%"></i></span>
              <span class="cnt">${c}</span>
            </div>`;
  }).join("");
  const rows = st.seasons.slice().reverse().map(s => `
    <div class="srow">
      <span>${s.champ ? "🏆 " : ""}${esc(s.title)}</span>
      <span class="rec">${s.w}–${s.t}–${s.l}</span>
      <span class="sav">${T().avgLbl} ${s.avg.toFixed(2)}</span>
    </div>`).join("");
  return `
    <div class="modal p-${p === "a" ? "arne" : "harald"}" data-modal="1">
      <div class="modal-head">
        <span><h2>${name}</h2><span class="sub">${T().allTime}</span></span>
        <span class="x" data-close="1">✕</span>
      </div>
      <div class="kpis">
        ${kpi(st.played, T().played)}${kpi(st.w, T().won)}${kpi(st.t, T().tied)}${kpi(st.l, T().lost)}
        ${kpi(st.avg.toFixed(2), T().avgLbl)}${kpi(Math.round(st.solved * 100) + "%", T().solvedLbl)}
        ${kpi(st.titles, T().titles)}${kpi(st.best, T().bestRun)}
      </div>
      <p class="runline">${T().curRun(st.run)}</p>
      <p class="msec">${T().distTitle}</p>
      <div class="dist">${bars}</div>
      <p class="msec">${T().bySeason}</p>
      <div>${rows}</div>
    </div>`;
}

let OPEN_PLAYER = null;

function openPlayer(p) {
  OPEN_PLAYER = p;
  const bg = document.getElementById("modal");
  bg.innerHTML = playerModalHTML(p);
  bg.style.display = "flex";
}

function closePlayer() {
  OPEN_PLAYER = null;
  const bg = document.getElementById("modal");
  bg.style.display = "none";
  bg.innerHTML = "";
}

document.getElementById("modal").addEventListener("click", e => {
  if (e.target.closest("[data-close]") || !e.target.closest("[data-modal]")) closePlayer();
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && OPEN_PLAYER) closePlayer(); });

let SEASONS = [];

function render() {
  document.getElementById("playlink").textContent = T().play;
  document.getElementById("foot").textContent = T().footer;
  document.querySelectorAll(".flag").forEach(f => f.classList.toggle("on", f.dataset.lang === LANG));
  const order = SEASONS.map((s, i) => i).reverse(); // newest first
  document.getElementById("root").innerHTML =
    order.map(i => seasonHTML(SEASONS[i], i)).join("");
  if (OPEN_PLAYER) openPlayer(OPEN_PLAYER);
}

document.getElementById("langsw").addEventListener("click", e => {
  const f = e.target.closest(".flag");
  if (!f || f.dataset.lang === LANG) return;
  LANG = f.dataset.lang;
  localStorage.setItem("lang", LANG);
  render();
});

document.getElementById("root").addEventListener("click", e => {
  const back = e.target.closest("[data-back]");
  if (back) {
    const si = +back.closest("[data-shoutbox]").dataset.shoutbox;
    selectShout(si, latestShoutIdx(SEASONS[si].games));
    return;
  }
  const col = e.target.closest(".score .col");
  if (col) { openPlayer(col.dataset.p); return; }
  const row = e.target.closest(".game");
  if (row) selectShout(+row.dataset.si, +row.dataset.gi);
});

fetch("data.json?v=" + Date.now(), { cache: "no-store" })
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(data => {
    if (data.play_url) document.getElementById("playlink").href = data.play_url;
    SEASONS = data.seasons;
    render();
  })
  .catch(e => {
    document.getElementById("root").innerHTML =
      '<div class="err">Couldn\'t load scores (' + esc(e.message) + ').</div>';
  });
</script>
</body>
</html>
